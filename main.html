<!DOCTYPE html>
<html>
    <head>
        <title>To-Do list</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        
        

        <div class="main">
            <div class="headToDo">
            <i class="fa-solid fa-clipboard-list"></i>
            <h3>To-do list</h3>
            </div>
            <div class="addDiv">
            <input type="text" placeholder="Please Enter a New Task" class="addText task-input">
            <button class="addBtn task-input">ADD</button>
            </div>
            
            <div class="task">
                <div>
                <input type="checkbox"> 
                <span>task</span>
                </div>
                <button class="deleteBtn">Delete</button>
            </div>
            


            
        </div>
       
        
    </body>
</html>
